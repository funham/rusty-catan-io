[package]
name = "catan-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catan-core = { path = "../catan-core" }
catan-bots = { path = "../catan-bots" }
log = "0.4.29"
env_logger = "0.11.10"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
statrs = "0.18.0"

[features]
bench-counters = ["catan-core/bench-counters"]
bench-allocs = []
