name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binaries: "catan-runtime catan-server catan-bench"
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binaries: "catan-runtime catan-server catan-bench"
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binaries: "catan-runtime catan-server catan-bench"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binaries: "catan-runtime.exe catan-server.exe catan-bench.exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p catan-runtime -p catan-server

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/rusty-catan-io-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$dist"
          for binary in ${{ matrix.binaries }}; do
            cp "target/${{ matrix.target }}/release/$binary" "$dist/"
          done
          cp -R catan-runtime/data "$dist/data"
          cp README.md "$dist/" 2>/dev/null || true

      - name: Archive release assets
        shell: bash
        run: |
          set -euo pipefail
          name="rusty-catan-io-${{ github.ref_name }}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name/*' -DestinationPath '$name.zip' -Force"
          else
            tar -czf "$name.tar.gz" -C dist "$name"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty-catan-io-${{ matrix.target }}
          path: |
            rusty-catan-io-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            rusty-catan-io-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
