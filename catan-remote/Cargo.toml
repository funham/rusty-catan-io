[package]
name = "catan-remote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
catan-core = { path = "../catan-core" }
catan-runtime = { path = "../catan-runtime" }
catan-tui = { path = "../catan-tui" }
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
bench-counters = ["catan-runtime/bench-counters"]
