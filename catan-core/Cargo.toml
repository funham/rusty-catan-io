[package]
name = "catan-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
itertools = "0.14.0"
log = "0.4.29"
num = "0.4.3"
rand = "0.10.1"
smallvec = { version = "1.15.1", features = ["const_generics", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28.0", features = ["derive"] }

[features]
bench-counters = []


[[bin]]
name = "hex_spiral_to_canonical"
path = "src/hex_spiral_to_canonical.rs"
